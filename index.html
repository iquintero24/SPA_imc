        content="This web application, developed with HTML, CSS, and JavaScript, aims to calculate a person's Body Mass Index (BMI) based on their weight and height. It provides a simple and intuitive interface so users can quickly obtain their results and learn their classification based on the value obtaine">

<body>

    <header>
  
    </header>

    <main>
        <h1>Calculator IMC</h1>
        <form action="" id="formCalculate">
            <label for="Weight">plis, enter your weight</label>
            <input type="number" name="weight" value="weight" placeholder="Enter your Kg" step="0.01">

            <label for="Height">plis, enter your Height</label>
            <input type="number" name="height" value="height" placeholder="Enter your Mt"  step="0.01">

            <label for="Height">Your IMC is</label>
            <input type="number" name="result" id="result" value="result" placeholder="" step="0.01">

            <button class="calculate" type="submit" name="submit">Calculate</button>

        </form>
    </main>

    <footer></footer>

    <script src="./src/js/main.js"></script>

</body>
